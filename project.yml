# The Xcode project is made from this file on GitHub's Mac (XcodeGen), so it can be written on Windows.
name: Todo
options:
  bundleIdPrefix: com.ray05real
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  Todo:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: TodoWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ray05real.todo
        PRODUCT_NAME: Todo
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: Config/App-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "To-do test"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
  TodoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ray05real.todo.widgets
        PRODUCT_NAME: TodoWidgets
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: Config/Widgets-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "To-do"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
