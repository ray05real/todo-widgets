# Builds the app on one of GitHub's Macs every time a change is saved to GitHub, and publishes an unsigned .ipa
# (Releases on the repository's page). The sideloading app signs it with the owner's certificate.
name: Build the .ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify

      - name: Make the Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Todo.xcodeproj -target Todo -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | xcbeautify --renderer github-actions

      - name: Pack the .ipa
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/Todo.app Payload/
          find Payload -maxdepth 4 | head -40
          zip -qry Todo.ipa Payload
          ls -lh Todo.ipa

      - name: Publish the .ipa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: Todo.ipa
          make_latest: true

      - name: Publish the log of a failed build
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log
          name: Last failed build's log
          prerelease: true
          files: build.log
